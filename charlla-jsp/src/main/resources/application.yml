server:
  port: 8081

spring:
  application:
    name: charlla-jsp
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    multipart:
      # 영상 파일이 이 서버를 통과해 charlla-api 로 간다. 기본값(1MB)이면 바로 막힌다.
      max-file-size: 500MB
      max-request-size: 510MB

charlla:
  # 이 모듈이 아는 주소는 우리 api 모듈뿐이다.
  api-base-url: ${CHARLLA_API_BASE_URL:http://localhost:8080}
